name: Battery Cooling Simulation

on:
  push:
    branches: [ main, feature/* ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # 수동 실행 가능

jobs:
  simulate:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Run validation
      run: |
        battery-aircooling validate --config examples/study_rib_sweep.yaml
    
    - name: Run simulation
      run: |
        battery-aircooling run --config examples/study_rib_sweep.yaml --mode ROM --output results
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: simulation-results
        path: |
          results/
        retention-days: 30
    
    - name: Display summary
      run: |
        cat results/summary.txt || echo "Summary not found"

  test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
        pip install pytest pytest-cov
    
    - name: Run tests
      run: |
        pytest tests/ -v --cov=battery_aircooling --cov-report=term-missing
