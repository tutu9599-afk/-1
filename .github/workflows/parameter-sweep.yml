name: Parameter Sweep Study

on:
  workflow_dispatch:  # 수동으로만 실행
    inputs:
      config_file:
        description: 'Configuration file to use'
        required: true
        default: 'examples/study_rib_sweep.yaml'
        type: choice
        options:
          - examples/study_rib_sweep.yaml
          - examples/compare_rib_types.yaml

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .
    
    - name: Run parameter sweep
      run: |
        battery-aircooling sweep --config ${{ github.event.inputs.config_file }} --output sweep_results
    
    - name: Upload results
      uses: actions/upload-artifact@v4
      with:
        name: sweep-results
        path: |
          sweep_results/
        retention-days: 90
    
    - name: Create results summary
      run: |
        echo "# Parameter Sweep Results" > sweep_summary.md
        echo "" >> sweep_summary.md
        echo "**Configuration**: ${{ github.event.inputs.config_file }}" >> sweep_summary.md
        echo "" >> sweep_summary.md
        
        if [ -f sweep_results/best_config.json ]; then
          echo "## Best Configuration" >> sweep_summary.md
          cat sweep_results/best_config.json >> sweep_summary.md
        fi
        
        cat sweep_summary.md
    
    - name: Upload summary
      uses: actions/upload-artifact@v4
      with:
        name: sweep-summary
        path: sweep_summary.md
